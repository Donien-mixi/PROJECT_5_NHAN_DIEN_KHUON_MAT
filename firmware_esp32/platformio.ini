[platformio]
; Code nằm ở gốc firmware_esp32/ (tương thích Arduino IDE),
; nên trỏ src_dir về đây thay vì thư mục src/ mặc định.
src_dir = .

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
; ESP32-S3 N16R8: 16MB Flash QD + 8MB Octal PSRAM
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Tăng kích thước bộ nhớ ứng dụng vì TFLite và ESP-WHO khá nặng
board_build.partitions = huge_app.csv

build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCORE_DEBUG_LEVEL=3
	-O3
	-DARDUINO_USB_CDC_ON_BOOT=1

lib_deps = 
	bodmer/TJpg_Decoder@^1.1.0
	tanakamasayuki/TensorFlowLite_ESP32@^1.0.0
	; esp-nn: không có package trong Registry PlatformIO theo tên 'esp-nn'.
	; Tăng tốc NN được đối chiếu theo gói ESP-IDF esp-nn riêng (cài bằng idf_component).
	; Không bật ở đây để build pass; ghi chú cho giai đoạn tối ưu (GĐ4).